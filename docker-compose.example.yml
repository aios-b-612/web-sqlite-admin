# Exemplo dual FE+API (PaaS) ou referência local.
# Sidecar do hosting: preferir Dockerfile.sidecar (uma imagem :80).

services:
  api:
    image: ${IMAGE_API:-ghcr.io/0ctor/web-sqlite-admin-api:latest}
    container_name: octor-web-sqlite-admin-api
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      BIND_ADDRESS: 0.0.0.0:8080
      OCTOR_SERVICE_NAME: web-sqlite-admin-api
      PASSWORD: ${PASSWORD:?}
      LOCATION: ${LOCATION:-/db/databases}
      ALLOWED_CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ${SQLITE_HOST_DIR:-./data}:/db
    networks:
      - proxy
      - octor
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${IMAGE_WEB:-ghcr.io/0ctor/web-sqlite-admin:latest}
    container_name: octor-web-sqlite-admin
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      OCTOR_SERVICE_NAME: web-sqlite-admin
      BUSINESS_API_INTERNAL_URL: http://octor-web-sqlite-admin-api:8080
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    networks:
      - proxy
      - octor
    depends_on:
      - api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  proxy:
    external: true
  octor:
    external: true
