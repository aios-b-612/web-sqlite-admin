name: CI API

on:
  pull_request:
    branches: [dev, main]
    paths: ['api/**', '.github/workflows/ci-api.yml']
  push:
    branches: [dev]
    paths: ['api/**', '.github/workflows/ci-api.yml']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · build
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main') && fromJSON('["self-hosted","Linux","X64","docker","octor-prd"]') || fromJSON('["self-hosted","Linux","X64","docker","octor-dev"]') }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
