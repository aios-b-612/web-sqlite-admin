name: CI Frontend

on:
  pull_request:
    branches: [dev, main]
    paths: ['frontend/**', '.github/workflows/ci-frontend.yml']
  push:
    branches: [dev]
    paths: ['frontend/**', '.github/workflows/ci-frontend.yml']

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build (panel password auth)
        env:
          NEXT_PUBLIC_CENTRAL_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_SQLITE_PANEL_PASSWORD_AUTH: 'true'
          AUTH_SECRET: ci-build-secret
          AUTH_TRUST_HOST: 'true'
          NEXTAUTH_URL: http://localhost:3000/
          BUSINESS_API_INTERNAL_URL: http://127.0.0.1:8080
        run: npm run build
